name: Reference Audit - Carrera AVON
on:
  push:
    branches:
      - design/zancada-carrera-avon-inspiration
    paths:
      - scripts/reference-avon-audit.mjs
      - .github/workflows/reference-avon-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Inspect public homepage
        run: node scripts/reference-avon-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carrera-avon-mobile-reference
          path: qa/avon-mobile-reference.jpg
          if-no-files-found: ignore
