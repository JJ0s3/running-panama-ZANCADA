name: ZANCADA Event Passport Mobile QA
on:
  pull_request:
    branches:
      - fix/zancada-running-first-reset
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-passport-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for QA
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
      - name: Start locally
        run: |
          nohup npm run start -- -p 3000 > /tmp/ep-next.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/ep-next.log
          exit 1
      - name: Run event passport mobile flow
        run: node scripts/event-passport-qa.mjs
        env:
          QA_INLINE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-passport-iphone-screens
          path: qa/*.jpg
          if-no-files-found: ignore
