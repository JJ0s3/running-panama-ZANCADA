name: ZANCADA Mobile Visual QA

on:
  pull_request:
    branches:
      - design/zancada-spatial-3d-direction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install application
        run: npm install --no-audit --no-fund
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start local app
        run: |
          nohup npm run start -- -p 3000 > /tmp/zancada-next.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/zancada-next.log
          exit 1
      - name: Inspect mobile layouts and Fasty tour
        run: node scripts/visual-qa.mjs
        env:
          QA_INLINE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zancada-iphone-qa
          path: qa/*.jpg
          if-no-files-found: ignore
