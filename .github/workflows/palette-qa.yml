name: ZANCADA · Paleta fiel visual QA
on:
  pull_request:
    paths:
      - 'app/palette-refresh.css'
      - 'app/page.tsx'
      - 'scripts/palette-qa.mjs'
      - 'tests/palette-refresh.test.mjs'
      - '.github/workflows/palette-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - run: npm run typecheck && npm test && npm run build
      - name: Start the app
        run: |
          nohup npm run start -- -p 3000 > /tmp/zancada-palette.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/zancada-palette.log
          exit 1
      - name: Check colors and interactions
        run: node scripts/palette-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zancada-palette-review
          path: qa/palette-*.png
          if-no-files-found: ignore
