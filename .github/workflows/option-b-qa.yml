name: ZANCADA · Opción B visual QA
on:
  pull_request:
    paths:
      - 'app/option-b.css'
      - 'app/page.tsx'
      - 'components/option-b-home.tsx'
      - 'components/event-passport-app.tsx'
      - 'components/results-hub.tsx'
      - 'components/event-tour.tsx'
      - 'scripts/option-b-qa.mjs'
      - '.github/workflows/option-b-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - run: npm run typecheck && npm test && npm run build
      - name: Start application
        run: |
          nohup npm run start -- -p 3000 >/tmp/zancada-qa.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/zancada-qa.log
          exit 1
      - name: Verify Opción B
        run: node scripts/option-b-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zancada-option-b-viewport-captures
          path: qa/option-b-*.png
          if-no-files-found: ignore
